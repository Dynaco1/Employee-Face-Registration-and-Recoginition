name: Code Quality

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "pyproject.toml"

  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "pyproject.toml"

jobs:
  linting:
    runs-on: ubuntu-latest
    name: Code Linting

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Ruff Check
        run: |
          ruff check app/

  type-checking:
    runs-on: ubuntu-latest
    name: Type Checking
    needs: linting

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run mypy
        run: |
          mypy app/